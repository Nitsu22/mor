name: Build Windows App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,mecab,build,test]"

      - name: Generate icons
        run: python scripts/generate_icon.py

      - name: Run tests
        run: python -m pytest

      - name: Build Windows app
        run: pyinstaller --noconfirm packaging/pyinstaller_windows.spec

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/形態素解析ツール" `
            -DestinationPath "dist/形態素解析ツール-windows.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 形態素解析ツール-windows
          path: dist/形態素解析ツール-windows.zip
