[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morph-app"
version = "0.1.0"
description = "Desktop morph-analysis app prototype"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mecab = [
    "mecab-python3>=1.0.9",
    "unidic-lite>=1.0.8",
]
gui = [
    "PySide6>=6.7",
]
build = [
    "pyinstaller>=6",
]
test = [
    "pytest>=8",
]
dev = [
    "mecab-python3>=1.0.9",
    "unidic-lite>=1.0.8",
    "PySide6>=6.7",
    "pyinstaller>=6",
    "pytest>=8",
]

[project.scripts]
morph-app = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
